id: bl_weather_report
requirements:
  - name: ecoscope-platform
    version: ">=2.25.1,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.4"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-ste
    version: "0.0.24"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-mnc
    version: "1.0.0.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-wwf-virunga
    version: "0.0.0rc9.*"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: ecoscope-workflows-ext-big-life
    version: "1.2.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/
    
  - name: pydeck
    version: 0.9.2  
    channel: conda-forge

  - name: opentelemetry-sdk
    version: ">=1.20.0,<2.0.0"
    channel: conda-forge

task-instance-defaults:
  skipif:
    conditions: 
      - any_is_empty_df 
      - any_dependency_skipped 

rjsf-overrides:
  properties:
    ndvi_method.properties.var.title: " "
    ndvi_method.properties.var.description: "Method to obtain NDVI values. 'MODIS MYD13A1 16-Day Composite': Uses pre-calculated NDVI from 16-day composites. Provides quality-filtered 'best pixel' values at 500m resolution with ~0.025 accuracy. Better for phenology studies but may saturate in dense canopies. 'MODIS MCD43A4 Daily NBAR': Uses daily nadir BRDF-adjusted reflectance. Computes NDVI from NIR/Red bands with view-angle correction for consistent measurements. Higher temporal resolution but more susceptible to cloud gaps."
    ndvi_method.properties.var.enum: [
      "MODIS MYD13A1 16-Day Composite",
      "MODIS MCD43A4 Daily NBAR",
    ]
    ndvi_method.properties.var.default: "MODIS MYD13A1 16-Day Composite"
    ndvi_method.required: []

workflow:
  # Set workflow details 
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  
  # Define time range 
  - name: Time Range
    id: time_range
    task: set_time_range

  # Define groupers 
  - name: Set Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers: 
        - index_name: "R_NAME"

  # Define GEE connnection 
  - name: Connect to Google Earth Engine
    id: gee_client 
    task: set_gee_connection

  #  Connect to ER 
  - name: Connect to EarthRanger
    id: er_client_name 
    task: set_er_connection

  # Set basemaps connection 
  - name: Configure Basemap Layers
    id: configure_base_maps
    task: set_base_maps
    partial:
      base_maps:
        - url: >-
            https://server.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}
          opacity: 1
          max_zoom: 20
        - url: >-
            https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
          opacity: 0.15
          max_zoom: 20

  - name: Download amboseli conservancy layers
    id: ambo_ranch_layers
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial:
      url: https://www.dropbox.com/scl/fi/wrcp3pnnxqyrclzmbtt1r/amboseli_ranch_conservancies_layers.gpkg?rlkey=jfbqj1b1nwhijxbsy7b2v1d29&st=d7rbqdfe&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3 
      unzip: false 
  
  - name: Download amboseli ranch boundaries and electric fence
    id: ambo_bound_fence 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/k6dgrmxmxeb3fe6glihwa/amboseli_group_ranch_boundaries_x_electric_fence.gpkg?rlkey=limtzffe88lr0iof5kf3b6uoy&st=rreho3tq&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false
  
  - name: Download ambo conservancies 
    id: ambo_conservancies 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/blo1smf49buhwx24y4z60/amboseli_group_ranch_boundaries.gpkg?rlkey=w86emavj8ug7zab73ifbzg6jv&st=v8uptlb0&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Load amboseli conservancy layers 
    id: load_ambo_layers 
    task: load_df 
    partial:  
      file_path: ${{ workflow.ambo_ranch_layers.return }}
      layer: null 
      deserialize_json: false 

  - name: Load amboseli ranch boundaries and electric fence 
    id: load_ambo_boundaries_fence 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_bound_fence.return }}
      layer: null 
      deserialize_json: false 
  
  - name: Load amboseli conservancies 
    id: load_ambo_conservancies 
    task: load_df 
    partial: 
      file_path: ${{ workflow.ambo_conservancies.return }}
      layer: null 
      deserialize_json: false 

  - name: Reproject gdf to 4326 for ambo layers 
    id: reproject_ambo_layers 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_layers.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo boundaries and electric fence 
    id: reproject_ambo_boundaries 
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_boundaries_fence.return }}
      target_crs: "EPSG:4326"

  - name: Reproject gdf to 4326 for ambo conservancies
    id: reproject_ambo_conservancies
    task: reproject_gdf
    partial: 
      gdf: ${{ workflow.load_ambo_conservancies.return }}
      target_crs: "EPSG:4326"

  - name: Apply colormap to amboseli land_use column
    id: apply_ambo_color
    task: apply_color_map
    partial:
      df: ${{ workflow.reproject_ambo_layers.return }}
      input_column_name: land_use
      output_column_name: land_use_color
      colormap:
        Rangeland: "#a39c91"
        Rangeland and settlement: "#ffa07a"
        Settlement and agriculture: "#2f4f4f"
        Conservancies: "#8fbc8b"
        National parks and reserves: "#4d6600"

  - name: Create amboseli land_use layer
    id: create_land_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.apply_ambo_color.return }}
      data_url: null
      layer_style:
        filled: true
        stroked: true
        get_fill_color: land_use_color
        get_line_color: land_use_color
        get_line_width: 0.85
        opacity: 0.75
      legend:
        title: Map Layers
        values:
          - label: Conservancies
            color: "#8fbc8b"

          - label: National park and reserves
            color: "#4d6600"

          - label: Settlement and agriculture
            color: "#2f4f4f"

          - label: Rangeland
            color: "#a39c91"

          - label: Rangeland and settlement
            color: "#ffa07a"

  - name: Filter to ambo ranch boundaries only
    id: filter_ambo_boundaries
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Ranch boundaries
      reset_index: true

  - name: Filter to ambo electric fence only
    id: filter_ambo_fence
    task: filter_df
    partial:
      df: ${{ workflow.reproject_ambo_boundaries.return }}
      column_name: land_use
      op: equal
      value: Electric Fence
      reset_index: true

  - name: Create ambo ranch boundaries layer
    id: create_bound_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.filter_ambo_boundaries.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [0, 0, 0]
        get_line_width: 0.95
        opacity: 0.55
      legend:
        title: ""
        values:
          - label: Ranch boundaries
            color: "#000000"

  - name: Create ambo electric fence layer
    id: create_fence_layer
    task: ecoscope.platform.tasks.results.create_geojson_layer
    partial:
      tooltip_columns: null
      geodataframe: ${{ workflow.filter_ambo_fence.return }}
      data_url: null
      layer_style:
        filled: false
        stroked: true
        get_line_color: [45, 98, 177]
        get_line_width: 5.5
        opacity: 1.0
      legend:
        title: ""
        values:
          - label: Electric fence
            color: "#2d62b1"
 
  - name: Retrieve rainfall events only 
    id: get_events_data
    task: get_events
    partial:
      event_states: null
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - reported_by
        - serial_number
        - geometry
        - created_at
        - event_details

      event_types:
        - rainfall_rep
      raise_on_empty: true
      include_details: true
      include_updates: false
      include_related_events: false
      include_null_geometry: false
      include_display_values: false
      force_point_geometry: true 

  # Add temporal index
  - name: Extract date from events data
    id: extract_event_date
    task: extract_column_as_type
    partial:
      fan_out: true
      df: ${{ workflow.get_events_data.return }}
      column_name: time
      output_type: date
      output_column_name: date

  - name: Add temporal index to events
    id: events_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.extract_event_date.return }}
      time_col: time 
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed 

  - name: Process rainfall event details
    id: process_rainfall_details
    task: ecoscope.platform.tasks.io.process_events_details 
    partial: 
      df: ${{ workflow.events_add_temporal_index.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true 
      ordered: true 

  - name: Normalize events column
    id: normalize_events_column
    task: normalize_json_column
    partial:
      column: event_details
      df: ${{ workflow.process_rainfall_details.return }}
      skip_if_not_exists: true 
      sort_columns: true 

  # rename columns 
  - name: Rename weather event columns 
    id: rename_weather_columns
    task: map_columns
    partial:
      duplicate_strategy: suffix
      drop_columns: [
        "event_type",
        "event_category",
        "reported_by",
        "serial_number",
        "patrols",
        "event_type_display",
      ]
      retain_columns: []
      rename_columns: {
        "event_details__Digital rain gauge (mm)": "digital_raingauge",
        "event_details__Manual rain gauge (mm)": "manual_raingauge",
        "event_details__Rain gauge station": "raingauge_station",
        "event_details__Rain gauge station zone": "zone"
        }
      raise_if_not_found: false
      df: ${{ workflow.normalize_events_column.return }}

  - name: Combine digital and manual readings to have overall rainfall recordings 
    id: combine_digital_manual
    task: combine_columns_with_fallback
    partial: 
      df: ${{ workflow.rename_weather_columns.return }}
      primary_column: digital_raingauge
      fallback_column: manual_raingauge
      output_column: overall_readings 
      fill_remaining: 0 
      inplace: true

  # convert cols to float
  - name: Convert columns to float
    id: convert_col_float
    task: convert_columns_to_float
    partial:
      df: ${{ workflow.combine_digital_manual.return }}
      columns: 
        - overall_readings
      errors: coerce 
      fill_value: 0 
      inplace: false

  - name: Group and aggregate values by rain station 
    id: group_and_aggregate 
    task: spatial_summarize_df
    partial:  
      gdf: ${{ workflow.convert_col_float.return }} 
      groupby_cols: 
        - raingauge_station
      reset_index: true 
      summary_params: 
        - display_name: geometry
          aggregator: first 
          column: geometry 
        
        - display_name: raingauge_readings 
          aggregator: sum 
          column: overall_readings
          original_unit: null 
          new_unit: null 
          decimal_places: 1 
    
  - name: Decompose rainfall events datetime 
    id: decompose_rainfall_date 
    task: decompose_datetime 
    partial: 
      df: ${{ workflow.convert_col_float.return }} 
      datetime_column: time 
      components: [
        "year",
        "month",
        "month_name"
        ]
      remove_source: false 
      column_prefix: null 
    
  # Draw Bar Chart
  - name: Draw Bar Chart
    id: draw_rainfall_chart
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.group_and_aggregate.return }}
      category: raingauge_station
      mode: grouped
      y_axis: null 
      stack_column: null 
      agg_function: sum
      stack_order: null 
      ascending: true 
      color_column: null 
      plot_style: null 
      bar_chart_configs:
        - column: raingauge_readings
          agg_func: sum
          label: "Raingauge Measurements (mm)"
          show_label: false
          style:
            marker_color: "#6495ed"
            textposition": null
            texttemplate": null
      overlay_opacity: 0.6
      category_order: null 
      layout_style: 
        bargap: 0.05
        bargroupgap: 0.05 
        title: null 
        title_x: 0.01 
        title_y: 0.95 
        showlegend: false
        font_size: 10
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Stations"
          range: null
        yaxis:
          title: "Raingauge Measurements (mm)"
          range: null 
      widget_id: null

  - name: Persist Rainfall bar chart
    id: persist_rainfall_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_rainfall_chart.return }}
      filename: rainfall_readings_over_time.html #-- convert to png

  - name: Create rainfall chart widget
    id: rainfall_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Rainfall Readings by Station"
      data: ${{ workflow.persist_rainfall_url.return }}

  - name: Persist rainfall data
    id: persist_rainfall_data
    task: persist_df
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: geoparquet
      df: ${{ workflow.group_and_aggregate.return }}
      filename: overall_rainfall_station_readings

  - name: Rename rainfall station table columns
    id: rename_rainfall_table_columns
    task: map_columns
    partial:
      duplicate_strategy: suffix
      df: ${{ workflow.group_and_aggregate.return }}
      drop_columns: []
      retain_columns: []
      rename_columns: {
        "raingauge_station": "Raingauge Station",
        "raingauge_readings": "Raingauge Readings"
        }
      raise_if_not_found: false

  - name: Draw rainfall by station summary table
    id: rainfall_station_table_html
    task: draw_table
    partial:
      dataframe: ${{ workflow.rename_rainfall_table_columns.return }}
      columns: ["Raingauge Station", "Raingauge Readings"]
      table_config:
        enable_sorting: true
        enable_filtering: true
        enable_download: false
        hide_header: false
      widget_id: "Rainfall by Station Summary"

  - name: Save rainfall by station summary table (HTML)
    id: rainfall_station_table_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.rainfall_station_table_html.return }}
      filename: rainfall_by_station_summary_table.html
      filename_suffix: null

  - name: Create rainfall by station table widget
    id: rainfall_station_table_widget
    task: create_table_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Rainfall by Station Summary"
      data: ${{ workflow.rainfall_station_table_html_url.return }}

  - name: Apply colormap to month_name column
    id: apply_month_color
    task: apply_color_map
    partial: 
      input_column_name: time_month_name
      output_column_name: colors
      colormap: Blues_r
      df: ${{ workflow.decompose_rainfall_date.return }}

  - name: Get calendar month names in order
    id: calendar_month_names
    task: ecoscope_workflows_ext_big_life.tasks.localization.month_names
    partial:
      abbreviated: false

  - name: Draw stacked bar chart by month 
    id: draw_monthly_stacked_bar_chart  
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_bar_chart
    partial:
      dataframe: ${{ workflow.apply_month_color.return }}
      category: raingauge_station
      mode: stacked
      y_axis: overall_readings
      stack_column: time_month_name 
      agg_function: sum
      stack_order: ${{ workflow.calendar_month_names.return }} 
      ascending: true 
      color_column: colors 
      plot_style: null 
      bar_chart_configs:
        - column: overall_readings
          agg_func: sum
          label: "Raingauge Measurements (mm)"
          show_label: true
          style:
            marker_color: "#6495ed"
            textposition": null
            texttemplate": null
      overlay_opacity: 0.6
      category_order: null 
      layout_style:
        bargap: 0.05
        bargroupgap: 0.05
        legend_title: "Month"
        title: null
        title_x: 0.01
        title_y: 0.95
        showlegend: true
        font_size: 10
        font_color: "#222222"
        plot_bgcolor: "#f5f5f5"
        xaxis:
          title: "Months"
          range: null
        yaxis:
          title: "Raingauge Measurements (mm)"
          range: null
      widget_id: null

  - name: Persist Rainfall bar chart
    id: persist_monthly_rainfall_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_monthly_stacked_bar_chart.return }}
      filename: monthly_rainfall_readings.html #-- convert to png

  - name: Create monthly rainfall chart widget
    id: monthly_rainfall_chart_widget
    task: create_plot_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Monthly Rainfall Readings"
      data: ${{ workflow.persist_monthly_rainfall_url.return }}

  - name: Create events point layer
    id: events_scatter_plot_layer 
    task: ecoscope_workflows_ext_big_life.tasks.results.create_clustered_labeled_scatterplot_layer
    partial: 
      data_url: null
      geodataframe: ${{ workflow.group_and_aggregate.return }}
      layer_style: 
        get_value: "raingauge_readings"
        aggregate: true
        cluster_padding: 1.0
        cluster_max_radius: 40
        get_fill_color: [100, 149, 237]
        get_line_color: [100, 149, 237]
        get_radius: "raingauge_readings"
        get_line_width: 1
        radius_units:  "pixels"
        radius_scale: 1
        radius_min_pixels: 0
        radius_max_pixels: null
        line_width_units: "pixels"
        line_width_scale: 1
        line_width_min_pixels: 0
        line_width_max_pixels: null
        stroked: true
        filled: true
        text_style:
          get_text_color: null
          text_size: 15
          scale_text_to_radius: true
          size_units: "pixels"
          font_family: "monospace"
          font_weight: "normal"
          outline_width: null
          outline_color: null
          get_text_anchor: "middle"
          get_alignment_baseline:  "center"

      legend:
        title: Readings
        values:
          - label: Rainfall readings
            color: "#6495ed"

  - title: Map Zoom & Extent
    type: task-group
    description: Calculate the geographic extent of the movement tracks and determine an appropriate zoom level and center point for the map. This ensures that all tracks are visible and well-framed when the map is rendered.
    tasks:
      - name: null
        id: zoom_to_envelope
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.envelope_gdf
        partial:
          gdf: ${{ workflow.group_and_aggregate.return }}
          expansion_factor: 1.10

      - name: Zoom view to gdf extent
        id: gdf_image_extent
        task: ecoscope_workflows_ext_ste.tasks.spatial_operations.compute_view_state_from_gdf
        partial:
          pitch: 0
          bearing: 0
          max_zoom: 15
          gdf: ${{ workflow.zoom_to_envelope.return }}

  - name: Combine styled layers with rainfall events
    id: combined_map_layers
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.combine_deckgl_map_layers
    partial:
      static_layers:
        - ${{ workflow.create_land_layer.return }}
        - ${{ workflow.create_bound_layer.return }}
        - ${{ workflow.create_fence_layer.return }}

      grouped_layers: 
        - ${{ workflow.events_scatter_plot_layer.return }}

  - name: Draw rainfall map
    id: draw_rainfall_map
    task: ecoscope_workflows_ext_big_life.tasks.results.draw_map
    partial:
      tile_layers: ${{ workflow.configure_base_maps.return }}
      static: false
      title: null
      max_zoom: 10
      legend_style:
        placement: "bottom-right"
      geo_layers: ${{ workflow.combined_map_layers.return }}
      view_state: ${{ workflow.gdf_image_extent.return }}

  - name: Persist rainfall map HTML paths
    id: persist_rainfall_urls
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      text: ${{ workflow.draw_rainfall_map.return }}
      filename: rainfall_map.html  # -- convert this to png

  - name: Create rainfall map widget
    id: rainfall_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Rainfall Map"
      data: ${{ workflow.persist_rainfall_urls.return }}

  - name: Split values by ranch name
    id: split_roi_groups 
    task: split_groups
    partial: 
      df: ${{ workflow.reproject_ambo_conservancies.return }}
      groupers: ${{ workflow.groupers.return }}
      
  - name: NDVI Method
    id: ndvi_method
    task: set_string_var
    
  - name: "NDVI Trend"
    id: calculate_ndvi
    task: calculate_ndvi_range
    partial:
      client: ${{ workflow.gee_client.return }}
      time_range: ${{ workflow.time_range.return }}
      ndvi_method: ${{ workflow.ndvi_method.return }}
      baseline_time_range: null # todo: add baseline time range when supported by web
      image_size: 1000000000 # todo: use baseline time range when supported by web
    mapvalues:
      argnames: roi
      argvalues: ${{ workflow.split_roi_groups.return}}

  - name: Draw NDVI Timeseries Chart
    id: draw_ndvi
    task: ecoscope_workflows_ext_wwf_virunga.tasks.plot.draw_historic_timeseries
    partial:
      current_value_column: "NDVI"
      current_value_title: "NDVI"
      historic_min_column: "min"
      historic_max_column: "max"
      historic_mean_column: "mean"
      historic_band_title: "Historic Min-Max"
      historic_mean_title: "Historic Mean"
      layout_style: null
      upper_lower_band_style:
        mode: lines
        line:
          color: "rgba(144, 238, 144, 0.8)"
        fillcolor: "rgba(144, 238, 144, 0.3)"
      historic_mean_style: null
      current_value_style: null
      time_column: img_date
      widget_id: null
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.calculate_ndvi.return}}

  - name: Get unique ranch name
    id: get_ranch_name
    task: ecoscope_workflows_ext_ste.tasks.transformation.column_first_unique_value
    partial:
      column_name: "R_NAME"
    mapvalues:
      argnames: df 
      argvalues: ${{ workflow.split_roi_groups.return }}

  - name: Combine ranch names and ndvi charts  
    id: zip_ranch_ndvi
    task: groupbykey
    partial:
      iterables:
        - ${{ workflow.draw_ndvi.return }}
        - ${{ workflow.get_ranch_name.return }}

  - name: Persist NDVI Chart as Text
    id: persist_ndvi
    task: persist_text
    partial:
      root_path:  ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    mapvalues:
      argnames: 
        - text
        - filename_suffix
      argvalues: ${{ workflow.zip_ranch_ndvi.return }}

  - name: Convert ndvi ranch chart to png 
    id: convrt_ranch_png 
    task: html_to_png 
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      config: 
        full_page: false
        device_scale_factor: 2.0 
        wait_for_timeout: 10 
        max_concurrent_pages: 3
    mapvalues:
      argnames: html_path
      argvalues: ${{ workflow.persist_ndvi.return }}

  - name: Convert bar chart to png 
    id: convrt_br_png 
    task: html_to_png 
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_rainfall_url.return }}
      config: 
        full_page: false
        device_scale_factor: 2.0 
        wait_for_timeout: 10 
        max_concurrent_pages: 1

  - name: Convert monthly bar chart to png 
    id: convrt_monthly_png 
    task: html_to_png 
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_monthly_rainfall_url.return }}
      config: 
        full_page: false
        device_scale_factor: 2.0 
        wait_for_timeout: 10 
        max_concurrent_pages: 1

  - name: Convert map to png 
    id: convert_map_png 
    task: html_to_png 
    partial: 
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      html_path: ${{ workflow.persist_rainfall_urls.return }}
      config: 
        full_page: false
        device_scale_factor: 2.0 
        wait_for_timeout: 40000
        max_concurrent_pages: 1

  - name: Download weather report word context 
    id: weather_report_word_doc 
    task: ecoscope_workflows_ext_ste.tasks.io.fetch_and_persist_file
    partial: 
      url: https://www.dropbox.com/scl/fi/mtsv3inq9u9443a676bn3/big_life_weather_report_template.docx?rlkey=hq3cnrdza32430iniffo6s39p&st=nsa0j1c1&dl=0
      output_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      overwrite_existing: false
      retries: 3
      unzip: false

  - name: Generate weather report 
    id: generate_bl_weather_report 
    task: generate_weather_report 
    partial:  
      template_path: ${{ workflow.weather_report_word_doc.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      rainfall_bar_chart: ${{ workflow.convrt_br_png.return }}
      rainfall_map: ${{ workflow.convert_map_png.return }}
      rainfall_monthly_bar_chart: ${{ workflow.convrt_monthly_png.return }}
      ranch_ndvi_charts: ${{ workflow.convrt_ranch_png.return }}
      generated_by: "Ecoscope"
      validate_images: true 
      box_height: 3.12
      box_width: 5.34
      time_period: ${{ workflow.time_range.return}}
      filename: "overall_report.docx"
      
  - name: Report files
    id: report_files
    task: create_files_single_view
    partial:
      files:
        - ${{ workflow.generate_bl_weather_report.return }}

  - name: Big life event report dashboard
    id: bl_events_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.rainfall_map_widget.return }}
        - ${{ workflow.rainfall_chart_widget.return }}
        - ${{ workflow.monthly_rainfall_chart_widget.return }}
        - ${{ workflow.rainfall_station_table_widget.return }}
      time_range: ${{ workflow.time_range.return}}
      groupers: ${{ workflow.groupers.return }}
      files: ${{ workflow.report_files.return }}
      
